<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>琵琶湖 旅のガイド</title>
<link rel="manifest" href="biwako-manifest.json">
<link rel="icon" href="../robohon-icon-192.png">
<link rel="apple-touch-icon" href="../robohon-icon-192.png">
<meta name="theme-color" content="#0e7490">
<style>
  body { font-family: "Meiryo", sans-serif; background: #ecfeff; padding: 12px; margin: 0; }
  .card { background: white; max-width: 560px; margin: 0 auto; padding: 16px; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); border: 3px solid #0e7490; }
  h1 { color: #155e75; font-size: 22px; margin: 0; text-align: center; }
  .date { text-align: center; color: #555; font-size: 14px; margin: 2px 0 8px; }
  #top { position: sticky; top: 0; z-index: 5; background: white; padding: 8px 0; }
  .now { font-size: 18px; font-weight: bold; line-height: 1.5; min-height: 84px; background: #1e293b; color: #fde68a; border-radius: 12px; padding: 12px; }
  .now small { display: block; color: #94a3b8; font-size: 14px; font-weight: normal; }
  .row { display: flex; gap: 8px; margin-top: 8px; } .row > * { flex: 1; }
  .big { font-size: 18px; font-weight: bold; padding: 12px; border-radius: 12px; border: none; color: white; cursor: pointer; }
  .more { background: #f59e0b; } .more.heard { background: #fcd34d; color: #78350f; }
  .item .has { flex: none; font-size: 12px; color: #b45309; }
  .next { background: #16a34a; } .again { background: #0891b2; } .stop { background: #ef4444; }
  h2 { color: #155e75; font-size: 19px; margin: 22px 0 4px; border-bottom: 2px solid #0e7490; }
  .route { color: #555; font-size: 14px; display: flex; align-items: center; gap: 6px; }
  .route input { width: 7em; font-size: 15px; padding: 4px 6px; border: 1px solid #999; border-radius: 6px; }
  .item { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; font-size: 17px; font-weight: bold; padding: 12px; margin-top: 8px; border-radius: 12px; border: 2px solid #67e8f9; background: #f0fdff; color: #164e63; cursor: pointer; }
  .item.note { border-color: #f59e0b; background: #fffbeb; color: #92400e; }
  .item.done { opacity: 0.55; }
  .item.done::after { content: "✓"; margin-left: auto; color: #16a34a; font-size: 22px; }
  .item.playing { border-color: #16a34a; background: #dcfce7; opacity: 1; }
  .side { flex: none; font-size: 14px; color: white; border-radius: 8px; padding: 3px 7px; }
  .side.L { background: #2563eb; } .side.R { background: #dc2626; }
  .foot { font-size: 13px; color: #555; margin-top: 20px; line-height: 1.6; }
  .reset { font-size: 14px; padding: 6px 10px; border-radius: 8px; border: 1px solid #999; background: #f1f5f9; cursor: pointer; }
</style>
</head>
<body>
<div class="card">
  <div id="top">
    <h1 id="title"></h1>
    <div class="date" id="date"></div>
    <div class="now" id="now"><small>ボタンを押すと、めたんの声で案内します</small></div>
    <div class="row" id="moreRow" hidden>
      <button class="big more" id="more2">くわしく ▶</button>
      <button class="big more" id="more3">もっと ▶</button>
    </div>
    <div class="row">
      <button class="big next" id="nextBtn">▶ 次へ</button>
      <button class="big again" id="againBtn">もう一度</button>
      <button class="big stop" id="stopBtn">■ 止める</button>
    </div>
  </div>
  <div id="list"></div>
  <div class="foot">
    <span id="credit"></span><br>
    <span id="offline">音声を保存しています…</span><br>
    <button class="reset" id="resetBtn">✓印を全部消す</button>
  </div>
</div>
<script src="biwako-data.js"></script>
<script>
const KEY = "tabi_biwako_";
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(KEY + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch {} }
};
const items = TRIP.sections.flatMap(s => s.items);
const done = new Set(store.get("done", []));
const times = store.get("times", {});
const audio = new Audio();
let current = -1;

document.getElementById("title").textContent = TRIP.title;
document.getElementById("date").textContent = TRIP.date;
document.getElementById("credit").textContent = TRIP.voice;

const list = document.getElementById("list");
TRIP.sections.forEach((sec, si) => {
  const h = document.createElement("h2"); h.textContent = sec.name; list.appendChild(h);
  const r = document.createElement("div"); r.className = "route";
  r.innerHTML = `<span>${sec.route}</span><span>出発</span>`;
  const t = document.createElement("input"); t.type = "time"; t.value = times[si] ?? sec.time;
  t.onchange = () => { times[si] = t.value; store.set("times", times); };
  r.appendChild(t); list.appendChild(r);
  sec.items.forEach(it => {
    const b = document.createElement("button");
    b.className = "item" + (it.note ? " note" : "") + (done.has(it.id) ? " done" : "");
    b.id = "btn_" + it.id;
    const side = it.side === "左" ? '<span class="side L">左</span>' : it.side === "右" ? '<span class="side R">右</span>' : "";
    b.innerHTML = side + `<span>${it.note ? "🚉 " : ""}${it.title}</span>` + (it.more ? '<span class="has">＋くわしく</span>' : "");
    b.onclick = () => play(items.indexOf(it));
    list.appendChild(b);
  });
});

// stage 1 = かんたん、2 = くわしく、3 = もっと
const STAGE = ["", "", "くわしく", "もっと"];
let stage = 1;
const moreRow = document.getElementById("moreRow");
function play(i, st = 1) {
  if (i < 0 || i >= items.length) return;
  const it = items[i];
  document.querySelectorAll(".item.playing").forEach(e => e.classList.remove("playing"));
  current = i; stage = st;
  const b = document.getElementById("btn_" + it.id);
  b.classList.add("playing", "done");
  done.add(it.id); store.set("done", [...done]); store.set("current", i);
  const side = it.side ? `【${it.side}側を見てね】` : "";
  const part = st === 1 ? it : it.more[st - 2];
  document.getElementById("now").innerHTML = `<small>${it.title} ${STAGE[st]} ${side}</small>${part.text}`;
  moreRow.hidden = !it.more;
  document.getElementById("more2").classList.toggle("heard", st >= 2);
  document.getElementById("more3").classList.toggle("heard", st >= 3);
  audio.src = "biwako/" + it.id + (st === 1 ? "" : "_" + st) + ".wav";
  audio.play().catch(() => {});
  if (st === 1) b.scrollIntoView({ block: "center", behavior: "smooth" });
}
document.getElementById("more2").onclick = () => play(current, 2);
document.getElementById("more3").onclick = () => play(current, 3);
audio.onended = () => document.querySelectorAll(".item.playing").forEach(e => e.classList.remove("playing"));

document.getElementById("nextBtn").onclick = () => play(current + 1 < items.length ? current + 1 : current);
document.getElementById("againBtn").onclick = () => play(current < 0 ? 0 : current, current < 0 ? 1 : stage);
document.getElementById("stopBtn").onclick = () => { audio.pause(); audio.onended(); };
document.getElementById("resetBtn").onclick = () => {
  if (!confirm("✓印を全部消して、最初からにしますか？")) return;
  done.clear(); store.set("done", []); store.set("current", -1); current = -1;
  document.querySelectorAll(".item.done").forEach(e => e.classList.remove("done"));
};
current = store.get("current", -1);

// 地下鉄やトンネルでも鳴るように、音声をスマホに保存する
const off = document.getElementById("offline");
if ("serviceWorker" in navigator) {
  const files = items.flatMap(it => ["biwako/" + it.id + ".wav", ...(it.more || []).map((m, n) => `biwako/${it.id}_${n + 2}.wav`)]);
  const saveAll = (sw) => {
    const ch = new MessageChannel();
    ch.port1.onmessage = e => { off.textContent = e.data.ok ? `音声 ${e.data.n} 本を保存しました（電波がなくても鳴ります）` : "音声の保存に失敗しました。電波のある所で開き直してください"; };
    sw.postMessage({ files }, [ch.port2]);
  };
  // 新しい版に切り替わったら、新しい版の置き場所に保存し直す
  navigator.serviceWorker.addEventListener("controllerchange", () => saveAll(navigator.serviceWorker.controller));
  navigator.serviceWorker.register("biwako-sw.js").then(() => navigator.serviceWorker.ready)
    .then(reg => saveAll(reg.active))
    .catch(() => { off.textContent = "このページを電波のある所で一度開いてください"; });
} else { off.textContent = ""; }
</script>
</body>
</html>
